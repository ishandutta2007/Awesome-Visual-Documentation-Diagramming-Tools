<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Node & Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Dot Pattern for Canvas -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }
    @keyframes floatNodeA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatNodeB {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes beamPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    .pulse-glow-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulse-glow-2 {
      animation: pulseGlow 7s ease-in-out infinite 1s;
      transform-origin: 1000px 240px;
    }
    .flow-line {
      stroke-dasharray: 6, 6;
      animation: dashMove 2.5s linear infinite;
    }
    .flow-line-reverse {
      stroke-dasharray: 6, 6;
      animation: dashMove 2.8s linear infinite reverse;
    }
    .floating-card-1 {
      animation: floatNodeA 5s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatNodeB 5.5s ease-in-out infinite 0.5s;
    }
    .beam-elem {
      animation: beamPulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#gridPattern)" />

  <!-- Ambient Glowing Blobs in Background -->
  <circle cx="180" cy="90" r="140" fill="#06b6d4" class="pulse-glow-1" filter="url(#glow)" />
  <circle cx="1020" cy="250" r="160" fill="#8b5cf6" class="pulse-glow-2" filter="url(#glow)" />
  <circle cx="600" cy="40" r="100" fill="#ec4899" opacity="0.12" filter="url(#glow)" />

  <!-- Background Architecture Flow Diagram / Nodes (Side Elements) -->
  <g opacity="0.65">
    <!-- Left Architecture Cluster -->
    <g class="floating-card-1">
      <rect x="40" y="60" width="130" height="55" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="55" y="85" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Client / Browser</text>
      <text x="55" y="102" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">React Flow / Canvas</text>

      <rect x="50" y="200" width="130" height="55" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <text x="65" y="225" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Diagram-as-Code</text>
      <text x="65" y="242" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Mermaid · D2 · PlantUML</text>
    </g>

    <!-- Left Connection Lines -->
    <path d="M 105 115 L 105 160 L 115 160 L 115 200" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flow-line" />
    <path d="M 170 88 C 240 88, 220 180, 290 180" fill="none" stroke="#a855f7" stroke-width="1.5" class="flow-line" />

    <!-- Right Architecture Cluster -->
    <g class="floating-card-2">
      <rect x="1010" y="60" width="145" height="55" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
      <text x="1025" y="85" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Collaborative Whiteboard</text>
      <text x="1025" y="102" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Excalidraw · Miro · tldraw</text>

      <rect x="1020" y="200" width="140" height="55" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="1035" y="225" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Cloud &amp; DB Schemas</text>
      <text x="1035" y="242" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">DrawDB · Lucid · C4 Model</text>
    </g>

    <!-- Right Connection Lines -->
    <path d="M 1080 115 L 1080 200" fill="none" stroke="#f472b6" stroke-width="1.5" class="flow-line-reverse" />
    <path d="M 1010 88 C 940 88, 960 180, 890 180" fill="none" stroke="#fbbf24" stroke-width="1.5" class="flow-line" />
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Feature Badges) - Always on Top -->
  <!-- Header Tag / Category -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <circle cx="-118" cy="0" r="5" fill="#38bdf8" class="beam-elem" />
    <text x="-105" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="118" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Visual Documentation &amp; Diagramming Tools
  </text>

  <!-- Subtitle -->
  <text x="600" y="156" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" letter-spacing="0.2">
    Diagram-as-Code Engines · Collaborative Infinite Whiteboards · Cloud &amp; C4 Architecture Blueprints
  </text>

  <!-- Decorative Accent Divider -->
  <line x1="420" y1="184" x2="780" y2="184" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Dynamic Capability Pills in Foreground -->
  <g transform="translate(600, 230)">
    <!-- Pill 1: Diagram-as-Code -->
    <g transform="translate(-320, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📐 Diagram-as-Code</text>
    </g>

    <!-- Pill 2: Infinite Whiteboards -->
    <g transform="translate(-110, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🎨 Infinite Whiteboards</text>
    </g>

    <!-- Pill 3: Cloud & C4 System Maps -->
    <g transform="translate(110, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">☁️ Cloud &amp; C4 Systems</text>
    </g>

    <!-- Pill 4: AI Diagram Generation -->
    <g transform="translate(320, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">✨ AI Diagram Gen</text>
    </g>
  </g>

  <!-- Bottom Stats Footer Bar -->
  <g transform="translate(600, 298)">
    <text x="0" y="0" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      ⚡ 11 Industry SaaS Leaders &amp; Enterprise Platforms &nbsp;•&nbsp; 🌟 30+ Star-Sorted Open-Source GitHub Projects
    </text>
  </g>
</svg>
